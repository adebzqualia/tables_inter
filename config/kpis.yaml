sources:
  ID Card:
    - name: "Opened accounts - AUTO (nb)"
      aggregation: sum

    - name: "Opened accounts - BtoC (nb)"
      aggregation: sum

    - name: "Opened accounts - B2B (nb)"
      aggregation: sum

    - name: "Opened accounts - Digital Bank (nb)"
      aggregation: sum

    - name: "Opened accounts - Cross Market (nb)"
      aggregation: sum

    - name: "Opened accounts - Non alloc. Market (nb)"
      aggregation: sum

    - name: "TOTAL Opened accounts (nb)"
      aggregation: sum

    - name: "Full End-to-End Automatic Granting Rate (%) (UW&Fin w/o Human intervention)"
      aggregation: ratio

    - name: "Automatic Underwriting rate (%)"
      aggregation: ratio

    - name: "Automatic Financing rate (%)"
      aggregation: ratio

    - name: "Partner Contact rate"
      aggregation: ratio

    - name: "Time of final decision bellow < 15' in B2C (%)"
      aggregation: ratio

    # The business rule/unit was not specified. Keep explicit rather than guessing.
    - name: "Full Expresso for B2C"
      aggregation: skip
      note: "Set to sum or ratio once the approved aggregation rule is known."

    - name: "Financed Leasing Mobility (%)"
      aggregation: ratio

    # The business rule/unit was not specified. Keep explicit rather than guessing.
    - name: "Full Expresso for Mobility"
      aggregation: skip
      note: "Set to sum or ratio once the approved aggregation rule is known."

    - name: "Granting & Financing VC OPEX (M€)"
      aggregation: sum

    - name: "Number Incoming Files to Granting and to Financing Stages (monthly avg.)"
      aggregation: sum

    # Productivity/index metrics are not safely additive, but the exact future
    # aggregation method was not specified.
    - name: "Granting Global Productivity Index"
      aggregation: skip
      note: "Non-additive; configure the approved aggregation method later."

    - name: "Granting Human Productivity"
      aggregation: skip
      note: "Non-additive; configure the approved aggregation method later."

    - name: "FTE M"
      aggregation: sum

    - name: "FTE B"
      aggregation: sum

    - name: "FTE S"
      aggregation: sum

    - name: "TOTAL FTE"
      aggregation: sum

# -----------------------------------------------------------------------------
# Duplicate-name / display-metadata example (commented out)
# -----------------------------------------------------------------------------
# Duplicate KPI names are allowed. They are matched in configuration order to
# exact same-name occurrences in the worksheet from top to bottom.
# ``type`` and ``subtype`` are OPTIONAL DISPLAY TEXT ONLY; they do not influence
# extraction and they may themselves also be names of other KPIs.
#
#    - name: "Number of accounts"
#      type: "OUTSTANDING"
#      subtype: "AUTO"
#      aggregation: sum
#
#    - name: "Number of accounts"
#      type: "PRODUCTION"
#      subtype: "AUTO"
#      aggregation: sum
#
# These would be displayed as:
# OUTSTANDING | AUTO | Number of accounts
# PRODUCTION  | AUTO | Number of accounts
