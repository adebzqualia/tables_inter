sheet_name_template: "{country}_{sheet}"
validation_sheet: INTER_VALIDATION
replace_existing_generated_sheets: true
table_spacing_rows: 3

# Navigation option only. The Excel formula ALWAYS keeps the detected source
# sheet/cell reference. Set this to false if you do not want clicking the
# intermediary value to jump to the source cell.
add_source_hyperlinks: true

# Optional type/subtype values are display-only and appear before the KPI name.
kpi_title_separator: " | "

sources:
  ID Card:
    enabled: true
    output_sheet: INTER_ID_CARD
    periods:
      - "2024"
      - "2025"
      - "F1 2026"
      - "F2 2026"
      - "F3 2026"
      - "PLAN 2026"
      - "B 2027"
      - "B 2028"
      - "PLAN 2028"
      - "B 2029"
      - "B 2030"
      - "PLAN 2030"

  # The KPI catalogs below are already populated in kpis.yaml. They remain
  # disabled until their exact period/header labels are configured here; those
  # period lists were not provided, so the program does not guess them.
  OBS KPI:
    enabled: false
    output_sheet: INTER_OBS_KPI
    periods: []

  FTE:
    enabled: false
    output_sheet: INTER_FTE
    periods: []

  CVC:
    enabled: false
    output_sheet: INTER_CVC
    periods: []

  GRANTING:
    enabled: false
    output_sheet: INTER_GRANTING
    periods: []

  CS:
    enabled: false
    output_sheet: INTER_CS
    periods: []

  CORE:
    enabled: false
    output_sheet: INTER_CORE
    periods: []

  NPL SALES:
    enabled: false
    output_sheet: INTER_NPL_SALES
    periods: []

  KPI:
    enabled: false
    periods: []

  NPL SALES2:
    enabled: false
    periods: []

  CREDIT BUREAU:
    enabled: false
    periods: []

  MBS (OPEX):
    enabled: false
    periods: []

  PROCUREMENT:
    enabled: false
    periods: []
