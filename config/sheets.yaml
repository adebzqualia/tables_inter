sheet_name_template: "{country}_{sheet}"
validation_sheet: INTER_VALIDATION
replace_existing_generated_sheets: true
table_spacing_rows: 3

# Intermediary country cells contain formulas linking to their detected source
# cells. If true, the same cells are also clickable links to the source location.
add_source_hyperlinks: true

# Optional type/subtype values are display-only and appear before the KPI name.
kpi_title_separator: " | "

sources:
  ID Card:
    enabled: true
    output_sheet: INTER_ID_CARD
    periods:
      - "2024"
      - "2025"
      - "F1 2026"
      - "F2 2026"
      - "F3 2026"
      - "PLAN 2026"
      - "B 2027"
      - "B 2028"
      - "PLAN 2028"
      - "B 2029"
      - "B 2030"
      - "PLAN 2030"

  OBS KPI:
    enabled: false

  FTE:
    enabled: false

  CVC:
    enabled: false

  GRANTING:
    enabled: false

  CS:
    enabled: false

  CORE:
    enabled: false

  NPL SALES:
    enabled: false

  KPI:
    enabled: false

  NPL SALES2:
    enabled: false

  CREDIT BUREAU:
    enabled: false

  MBS (OPEX):
    enabled: false

  PROCUREMENT:
    enabled: false
