sheet_name_template: "{country}_{sheet}"
validation_sheet: INTER_VALIDATION
replace_existing_generated_sheets: true
table_spacing_rows: 3

# Navigation option only. The Excel formula ALWAYS keeps the detected source
# sheet/cell reference. Set this to false if you do not want clicking the
# intermediary value to jump to the source cell.
add_source_hyperlinks: true

# Optional type/subtype values are display-only and appear before the KPI name.
kpi_title_separator: " | "

# Optional rounding for generated intermediary values and totals.
# Non-ratio KPIs use round_digits; ratio KPIs keep their own decimal precision.
# Example: 4331.9 -> 4332, while 12.34% -> 12.3%.
round_values: true
round_digits: 0
ratio_round_digits: 1

# Legacy strict simple-ratio inference used only if recursive_formula_totals is
# disabled. With recursive tracing enabled below, cross-sheet formula lineage is
# used instead.
infer_ratio_totals_from_formulas: true


# Recursive formula lineage. Derived KPIs may follow references through the KPI
# sheet and back into other operational sheets. Only required supporting KPI
# tables are materialized on INTER_DEPENDENCIES.
recursive_formula_totals: true
dependency_sheet: INTER_DEPENDENCIES
aggregation_control_sheet: INTER_CONFIG
kpi_source_name: KPI
kpi_name_header: KPI
formula_max_depth: 20

# Newly discovered ordinary/value KPIs default to SUM. Operational users can
# switch any value KPI between SUM and AVERAGE directly in INTER_CONFIG.
default_dependency_aggregation: sum

# All source sheets use the same configured period columns for this version.
sources:
  ID Card:
    enabled: true
    output_sheet: INTER_ID_CARD
    periods: &common_periods
      - "2024"
      - "2025"
      - "F1 2026"
      - "F2 2026"
      - "F3 2026"
      - "PLAN 2026"
      - "B 2027"
      - "B 2028"
      - "PLAN 2028"
      - "B 2029"
      - "B 2030"
      - "PLAN 2030"

  OBS KPI:
    enabled: true
    output_sheet: INTER_OBS_KPI
    periods: *common_periods

  FTE:
    enabled: true
    output_sheet: INTER_FTE
    periods: *common_periods

  CVC:
    enabled: true
    output_sheet: INTER_CVC
    periods: *common_periods

  GRANTING:
    enabled: true
    output_sheet: INTER_GRANTING
    periods: *common_periods

  CS:
    enabled: true
    output_sheet: INTER_CS
    periods: *common_periods

  CORE:
    enabled: true
    output_sheet: INTER_CORE
    periods: *common_periods

  NPL SALES:
    enabled: true
    output_sheet: INTER_NPL_SALES
    periods: *common_periods

  KPI:
    enabled: true
    output_sheet: INTER_KPI
    periods: *common_periods

  NPL SALES2:
    enabled: true
    output_sheet: INTER_NPL_SALES2
    periods: *common_periods

  CREDIT BUREAU:
    enabled: true
    output_sheet: INTER_CREDIT_BUREAU
    periods: *common_periods

  MBS (OPEX):
    enabled: true
    output_sheet: INTER_MBS_OPEX
    periods: *common_periods

  PROCUREMENT:
    enabled: true
    output_sheet: INTER_PROCUREMENT
    periods: *common_periods
