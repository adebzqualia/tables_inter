# KPI catalog by source sheet.
#
# type/subtype are DISPLAY-ONLY metadata. They never participate in matching.
# Duplicate KPI names are expected and are mapped by configuration order to
# same-name worksheet occurrences from top to bottom, independently per country.
#
# Aggregation metadata remains explicit:
#   sum   -> currently generates a linked intermediary table + Excel SUM totals
#   ratio -> recognized but deliberately not generated/aggregated yet
#   skip  -> non-additive/ambiguous metric kept in the catalog for later rules
#
# Review aggregation classifications with the business before production use.
